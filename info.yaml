# Tiny Tapeout project information
project:
  title:        "Plant Emulator (1st order)"
  author:       "Fatima Hernandez"
  discord:      ""
  description:  "Emulador de planta de primer orden con tau ajustable y escalon interno"
  language:     "Verilog"
  clock_hz:     1000000

  tiles: "1x1"

  top_module:  "tt_um_plant_emulator"

  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "K0 (tau = 2^(K+1) muestras)"
  ui[1]: "K1"
  ui[2]: "K2"
  ui[3]: "MANUAL (1 = escalon manual)"
  ui[4]: "P0 (muestreo = clk / 2^P)"
  ui[5]: "P1"
  ui[6]: "P2"
  ui[7]: "P3"

  # Outputs
  uo[0]: "Y0"
  uo[1]: "Y1"
  uo[2]: "Y2"
  uo[3]: "Y3"
  uo[4]: "Y4"
  uo[5]: "Y5"
  uo[6]: "Y6"
  uo[7]: "Y7"

  # Bidirectional pins
  uio[0]: "AMP0"
  uio[1]: "AMP1"
  uio[2]: "ESCALON_MANUAL"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: "TICK (salida)"
  uio[7]: "X_ESCALON (salida)"
